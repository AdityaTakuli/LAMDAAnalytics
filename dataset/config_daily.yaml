# Independent 2024 daily diagnostic profile.
# This profile reads the already downloaded one_year_2024 sources and never
# writes into that monthly directory.
analysis:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  daily_step: "D"
  prediction_horizon_days: 1
  monthly_availability_assumption: "month_start"

daily_pipeline:
  source_profile_dir: "data/one_year_2024"
  selected_universe: "data/one_year_2024/processed/country_universe.csv"
  gdelt_features: "data/one_year_2024/processed/gdelt_features.csv"
  weather_daily: "data/one_year_2024/processed/weather_daily.csv"
  comtrade_monthly: "data/one_year_2024/processed/comtrade.csv"
  gscpi_monthly: "data/one_year_2024/processed/gscpi_monthly.csv"
  monthly_nodes: "data/one_year_2024/processed/nodes_monthly.csv"
  monthly_edges: "data/one_year_2024/processed/edges_monthly.csv"
  cset_directory: "data/one_year_2024/processed/cset"

sources:
  gdelt:
    original_frequency: "daily"
    feature_clock: "DATEADDED / UTC day"
  weather:
    original_frequency: "daily"
    feature_clock: "observed_date / UTC day"
  comtrade:
    original_frequency: "monthly"
    daily_transformation: "carry monthly structural features within month"
    availability_assumption: "month_start"
  gscpi:
    original_frequency: "monthly"
    daily_transformation: "carry latest monthly value within month"
    availability_assumption: "month_start"
  cset:
    original_frequency: "static"
    use_existing_graph_relationships: false

outputs:
  root: "data/one_year_2024_daily"
  raw_directory: "data/one_year_2024_daily/raw"
  cache_directory: "data/one_year_2024_daily/cache"
  processed_directory: "data/one_year_2024_daily/processed"
  daily_nodes: "data/one_year_2024_daily/processed/nodes_daily.csv"
  monthly_edge_templates: "data/one_year_2024_daily/processed/edge_templates_monthly.csv"
  snapshot_manifest: "data/one_year_2024_daily/processed/snapshot_manifest.csv"
  graph: "data/one_year_2024_daily/processed/graph_daily.json"
  results: "data/one_year_2024_daily/results"
  diagnostics: "data/one_year_2024_daily/results/diagnostics"
  target_diagnostics: "data/one_year_2024_daily/results/target_diagnostics"
