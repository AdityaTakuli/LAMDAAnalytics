# Isolated daily-training gate for the real 2024 profile.
# It reads one_year_2024_daily and writes only one_year_2024_daily_training.
analysis:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  prediction_horizon_days: 1

daily_training:
  input_root: "data/one_year_2024_daily"
  train_start: "2024-01-01"
  train_end: "2024-06-30"
  validation_start: "2024-07-01"
  validation_end: "2024-09-30"
  test_start: "2024-10-01"
  test_end: "2024-12-30"
  excluded_dates:
    - "2024-12-31"

outputs:
  root: "data/one_year_2024_daily_training"
  results: "data/one_year_2024_daily_training/results"
